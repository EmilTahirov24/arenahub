# Weekly, not daily: this is a one-person project, and a pull request nobody has
# time to read is worse than no pull request. Weekly is a rate the maintainer can
# actually keep up with.
#
# Patch and minor updates are grouped into one pull request per ecosystem. Twenty
# separate bumps do not get reviewed; one does.
#
# Major updates are deliberately NOT grouped — those are the ones that need
# reading, and they should arrive on their own.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Two majors are held back, and not because they were not looked at. Both
    # were installed, run and reverted; the compiler and the tests were fine in
    # each case and the LINT step was what failed, in a dependency of
    # eslint-config-next rather than in this project.
    #
    #   typescript 7  -> "typescript-eslint does not support TS 7.0"
    #                    tracked at typescript-eslint/typescript-eslint#10940
    #   eslint 10     -> eslint-plugin-react calls contextOrFilename.getFilename,
    #                    an API removed in ESLint 10
    #
    # Upgrading either today means either a broken lint step or turning linting
    # off, and neither is worth a version number. Remove the matching entry once
    # the plugin ecosystem catches up.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
