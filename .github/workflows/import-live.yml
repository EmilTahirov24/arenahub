# Keeps upcoming, live and just-finished matches current.
#
# Runs here rather than on Vercel because Vercel's free plan allows one cron a
# day, which is useless for a live page.
#
# GitHub's scheduler is best-effort, and the earlier note here understated it:
# it said runs "drift by several minutes". Measured on 2026-08-27 against a
# */20 schedule, the actual gaps between runs were 1h12m, 45m, 1h41m, 57m,
# 2h05m, 3h04m and 5h11m — hours, not minutes. Scheduled workflows are queued
# behind paid and pushed work, and the free tier loses that queue.
#
# Two consequences worth knowing:
#
#   The cron below asks for every 20 minutes and will not get it. It is kept
#   because a request that is sometimes honoured beats no request, but the
#   honest expectation is "a few times a day".
#
#   Minutes were moved off :00/:20/:40. Those are the busiest slots on the whole
#   platform — everyone writes */20 and 0 * * * * — so a request landing there
#   queues behind the largest spike. Odd minutes are less contended. This is a
#   mitigation, not a fix; GitHub promises nothing either way.
#
# If genuine 20-minute freshness is ever needed, the schedule is the wrong tool:
# it takes either an external trigger calling workflow_dispatch, or a paid
# scheduler. Both are decisions, not tweaks.
#
# Needs one secret: DATABASE_URL. Liquipedia requires no key, only the
# descriptive User-Agent the client already sends.
#
# Note: GitHub disables scheduled workflows on repositories with no activity for
# 60 days. If matches stop updating, check that first.
name: Import live matches

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  # The first scheduled run failed during `npm ci`, which is invisible until the
  # next tick — and that tick can be hours away. Editing this file proves itself
  # straight away instead.
  push:
    paths: [".github/workflows/import-live.yml"]

# A slow run must not overlap the next tick: two importers writing the same
# matches at once would race on the create-or-update check.
concurrency:
  group: import-live
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    # One pass makes four action=parse calls, each throttled to one per 30s by
    # Liquipedia's terms, plus the database writes.
    timeout-minutes: 15
    # Job-wide rather than per-step: the root package.json has a `postinstall`,
    # so `npm ci` runs project code too and must not be the one step that is
    # missing the environment.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      # package-lock.json is written by npm 11 and carries `allowScripts`, which
      # only npm 11 understands. Node 22 ships npm 10, so the runner has to stay
      # on the major the lockfile came from.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Printed so that a future install failure can be read off the log instead
      # of being guessed at.
      - name: Versions
        run: node -v && npm -v

      - run: npm ci

      # The Prisma client is generated into app/generated and not committed.
      - run: npx prisma generate

      # Checked after the install so that a failure here is unambiguous: the
      # dependencies are fine and the only thing missing is the secret.
      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set. Add it under Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi
          echo "DATABASE_URL is present (${#DATABASE_URL} characters)."

      - id: live
        run: npx tsx scripts/import-live.ts --apply

      # The match list carries a series score and no map breakdown, so the maps
      # come from the tournament pages afterwards. Capped per run: an event whose
      # games are held in Liquipedia's match database can only be read from the
      # rendered page, and that endpoint allows one request every 31s. Six pages
      # is about three minutes, and the backlog shrinks every hour.
      - id: maps
        run: npx tsx scripts/import-maps.ts --apply --limit 6

      # Ratings are a full replay of every finished match, so they have to be
      # rebuilt after new results land — see lib/elo.ts.
      #
      # Only when something was actually written. Measured across two runs, the
      # replay took 108s and 278s of a 387s and 475s job — between a quarter and
      # well over half of it — and it grows with every match added. Most passes
      # write nothing at all, and replaying an unchanged history cannot change a
      # rating, so that time was pure waste.
      #
      # Halving the job matters beyond speed here: this schedule asks for 72 runs
      # a day of a nine-minute job on free shared runners, and GitHub has been
      # delivering fewer and fewer of them. A cheaper job is a better-behaved one.
      - if: steps.live.outputs.wrote == 'true' || steps.maps.outputs.wrote == 'true'
        run: npx tsx scripts/recompute-ratings.ts

      - if: steps.live.outputs.wrote != 'true' && steps.maps.outputs.wrote != 'true'
        run: echo "Heç nə yazılmadı — reytinq yenidən hesablanmadı."
