# Type check, lint, unit tests — and proof that `docker compose up` actually
# works. The README claims it does; this is what makes that a fact rather than
# an assertion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  docker:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up -d --build

      # Two separate waits, because the two failures need different fixes:
      # nothing listening on the port is a container problem, while a port that
      # answers with an error is an application problem. One combined check
      # cannot tell them apart.
      - name: Wait for the port to answer
        run: |
          for i in $(seq 1 90); do
            if curl -s -o /dev/null --max-time 5 http://localhost:3000/az; then
              echo "port answered after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "nothing listening on :3000 after 15 minutes"
          exit 1

      - name: The site answers 200
        run: curl -fsS --max-time 30 http://localhost:3000/az > /dev/null

      - name: The page is really the site
        run: curl -fsS --max-time 30 http://localhost:3000/az | grep -q "ArenaHub"

      # Job logs need a token to read and the step summary is not exposed, but
      # ANNOTATIONS are public. So the diagnosis is written as one.
      - name: Report the failure
        if: failure()
        run: |
          root=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/ || echo none)
          az=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/az || echo none)
          body=$(curl -s --max-time 10 http://localhost:3000/az 2>/dev/null | head -c 400 | tr '\n\r' '  ' || true)
          state=$(docker compose ps -a --format '{{.Name}}:{{.State}}' 2>/dev/null | tr '\n' ' ' || true)
          logs=$(docker compose logs --no-color --tail=30 web 2>&1 | tail -c 1400 || true)
          msg="root=${root} az=${az} || state: ${state} || body: ${body} || logs: ${logs}"
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          msg="${msg//$'\r'/'%0D'}"
          echo "::error title=docker diagnosis::${msg}"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
