# Type check, lint, unit tests — and proof that `docker compose up` actually
# works. The README claims it does; this is what makes that a fact rather than
# an assertion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test

  docker:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      # The container migrates, seeds and builds before it serves, so the first
      # response is minutes away. Poll rather than sleep on a guess.
      - name: Wait for the site
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/az > /dev/null 2>&1; then
              echo "site answered after $((i * 10))s"
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then
              echo "--- still waiting, $((i * 10))s in ---"
              docker compose logs --no-color --tail=5 web || true
            fi
            sleep 10
          done
          echo "site did not answer within 15 minutes"
          exit 1

      - name: The page is really the site
        run: curl -fsS http://localhost:3000/az | grep -q "ArenaHub"

      # The job log needs a token to read, so the diagnosis is encoded in step
      # OUTCOMES, which are public. Each one reports how far the container got,
      # using the stage markers the image prints as it starts.
      - name: "DIAG reached migrate"
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color web | grep -q -- "--- migrate ---"

      - name: "DIAG reached seed"
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color web | grep -q -- "--- seed ---"

      - name: "DIAG reached build"
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color web | grep -q -- "--- build ---"

      - name: "DIAG reached start"
        if: failure()
        continue-on-error: true
        run: docker compose logs --no-color web | grep -q -- "--- start ---"

      - name: "DIAG web container still running"
        if: failure()
        continue-on-error: true
        run: docker inspect -f "{{.State.Running}}" "$(docker compose ps -aq web)" | grep -q true

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
