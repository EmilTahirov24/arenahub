# Həftəlik nəticə icmalını yazır.
#
# Niyə ayrıca iş: import-live hər 20 dəqiqədə qaçır, bu isə həftədə bir dəfə.
# Onları birləşdirmək icmalı hər qaçışda yenidən yazardı.
#
# Niyə burada `schedule` bəs edir, halbuki import-live üçün etmirdi: GitHub
# pulsuz planda `schedule`-ı saatlarla gecikdirir. İdxal üçün bu ölümcül idi —
# canlı matç köhnəlir. İcmal üçün deyil: bazar ertəsi səhər yerinə günorta
# yazılması heç nəyi dəyişmir. Ona görə burada tetikleyici lazım deyil.
#
# Skript özü təkrarlara davamlıdır: slug tarix aralığını daşıyır, yəni eyni
# həftə üçün ikinci qaçış yeni məqalə yaratmır, mövcudu yeniləyir. Matçsız
# həftədə isə heç nə yazmır.
name: Weekly roundup

on:
  schedule:
    # Bazar ertəsi, keçən həftə tam bitəndən sonra.
    - cron: "23 6 * * 1"
  workflow_dispatch:
  # Skriptin özü də siyahıdadır: mətn dəyişəndə köhnə məqalələr köhnə mətnlə
  # qalırdı və dəyişikliyi görmək üçün bazar ertəsini gözləmək lazım gəlirdi.
  # Yenidən yazmaq təhlükəsizdir — slug eynidir, `publishedAt` isə əhatə olunan
  # həftədən gəlir, ona görə sıralama tərpənmir.
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-roundup.yml"
      - "scripts/generate-weekly-roundup.ts"

concurrency:
  group: weekly-roundup
  cancel-in-progress: false

jobs:
  roundup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Verify database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is not set."
            exit 1
          fi

      # Son 8 həftə hər qaçışda yenidən yoxlanılır, təkcə keçən həftə yox.
      #
      # İki səbəb. Birincisi: xəbər bölməsində cəmi iki yazı vardı və səhifə boş
      # görünürdü, halbuki bazada aylarla real nəticə dayanır — həmin həftələr
      # sadəcə heç vaxt yazılmamışdı. İkincisi: bir bazar ertəsi qaçış uğursuz
      # olsa, o həftə əvvəl həmişəlik itirdi; indi növbəti qaçış onu doldurur.
      #
      # Təkrardan qorxmur: slug tarix aralığını daşıyır, yəni eyni həftə
      # yenilənir, ikinciləşmir. `publishedAt` isə əhatə olunan həftənin sonudur,
      # ona görə köhnə həftəni yenidən yazmaq onu siyahının başına atmır.
      # Matçsız həftə heç nə yazmır.
      - name: Generate roundups (last 8 weeks)
        run: |
          for w in 1 2 3 4 5 6 7 8; do
            echo "--- həftə -$w ---"
            npx tsx scripts/generate-weekly-roundup.ts --weeks "$w" --apply
          done
